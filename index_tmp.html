<!DOCTYPE html>
<html>
<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of
      the `--base-href` argument provided to `flutter build`.
    -->
    <base href="/">
    <meta name="viewport"
          content="height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">


    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="meme">
    <meta name="description" content="Meme editor, meme templates, make memes, no watermark, no signup required, 10.000+ templates, meme generator"/>
    <meta property="og:title" content="Meme Express"/>
    <meta property="og:description" content="Meme editor, meme templates, make memes, no watermark, no signup required, 10.000+ templates, meme generator"/>
    <meta property="og:image" content="favicon.ico"/>

    <link rel="apple-touch-icon" href="icons/Icon-512.webp">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <title>Meme Express - Free meme editor</title>
    <link rel="manifest" href="manifest.json">

    <script>
        // The value below is injected by flutter build, do not touch.
        const serviceWorkerVersion = "135862805";
    </script>
    <!-- This script adds the flutter initialization JS code -->

    <style>
        html {
              scroll-behavior: smooth;
        }
        .emoji {
          font-size: 1.2rem;
          margin-right: 0.4rem;
        }
    </style>

</head>
<body>
<script src="flutter.js" defer></script>
<script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
</script>
</body>
</html>
