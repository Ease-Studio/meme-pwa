<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Templates Gallery</title>
    <meta name="description" content="Browse our collection of popular meme templates and find the perfect meme for your next post.">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            display: block;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            transition: transform .2s, box-shadow .2s;
        }

        .gallery-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,.15);
        }

        .gallery-item img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        .gallery-content {
            padding: 15px;
        }

        .gallery-title {
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 8px;
        }

        .gallery-description {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Meme Templates</h1>

        <div class="gallery">

            <a class="gallery-item" href="distracted_boyfriend_meme.html">
                <img src="https://storage.googleapis.com/y_meme_templates/3.jpg" alt="Distracted Boyfriend" loading="lazy">
                <div class="gallery-content">
                    <h2 class="gallery-title">Distracted Boyfriend</h2>
                </div>
            </a>

            <a class="gallery-item" href="drake_meme.html">
                <img src="https://storage.googleapis.com/y_meme_templates/0.jpg" alt="Drake" loading="lazy">
                <div class="gallery-content">
                    <h2 class="gallery-title">Drake</h2>
                </div>
            </a>

            <a class="gallery-item" href="what_meme.html">
                <img src="https://storage.googleapis.com/y_meme_templates/5982.jpg" alt="Confused Nick Young" loading="lazy">
                <div class="gallery-content">
                    <h2 class="gallery-title">Confused Nick Young</h2>
                </div>
            </a>

            <a class="gallery-item" href="speed_dating_meme.html">
                <img src=" https://storage.googleapis.com/y_meme_templates/4383.jpg" alt="Speed Dating" loading="lazy">
                <div class="gallery-content">
                    <h2 class="gallery-title">Speed Dating</h2>
                </div>
            </a>

        </div>
    </main>
</body>
</html>
